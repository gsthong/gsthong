name: Update contribution arcade

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-arcade
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Generate light and dark animations
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: ./output/

      - name: Publish arcade assets
        shell: bash
        run: |
          set -euo pipefail
          test -s output/light.svg
          test -s output/dark.svg
          mkdir -p assets
          cp output/light.svg assets/breakout-light.svg
          cp output/dark.svg assets/breakout-dark.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/breakout-light.svg assets/breakout-dark.svg
          if git diff --cached --quiet; then
            echo 'Arcade already up to date.'
            exit 0
          fi
          git commit -m 'chore: update contribution arcade'
          git push